<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<base target="_top">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>甘丹數據中心｜YouTube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ---------- 色彩與字型（甘丹：北歐極簡、溫暖米白） ---------- */
  :root {
    color-scheme: light;
    --page: #f4f1ec;
    --surface: #fbfaf7;
    --card: #fffefc;
    --ink: #1f1d1a;
    --ink-2: #5b5750;
    --muted: #8d877e;
    --grid: #e6e2da;
    --base: #c9c3b8;
    --ring: rgba(31, 29, 26, 0.08);
    --shadow: 0 1px 2px rgba(31, 29, 26, 0.04), 0 8px 24px rgba(31, 29, 26, 0.06);
    --organic: #2a78d6;      /* 自然＝categorical 1（已驗證） */
    --organic-wash: rgba(42, 120, 214, 0.10);
    --ads: #eb6834;          /* 廣告＝categorical 2（已驗證） */
    --good: #0b7a0b;
    --bad: #c23434;
    --accent: #6f8a6a;       /* 鼠尾草綠：只當裝飾，不當資料色 */
    --radius: 18px;
    --font: "Noto Sans TC", system-ui, -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #121110; --surface: #1c1b19; --card: #201f1c; --ink: #f6f3ee; --ink-2: #cfc9bf; --muted: #9a948a;
      --grid: #2e2c29; --base: #3d3a36; --ring: rgba(255,255,255,0.08); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
      --organic: #3987e5; --organic-wash: rgba(57,135,229,0.14); --ads: #d95926; --good: #3cc43c; --bad: #ef7777; --accent: #9db398;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #121110; --surface: #1c1b19; --card: #201f1c; --ink: #f6f3ee; --ink-2: #cfc9bf; --muted: #9a948a;
    --grid: #2e2c29; --base: #3d3a36; --ring: rgba(255,255,255,0.08); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
    --organic: #3987e5; --organic-wash: rgba(57,135,229,0.14); --ads: #d95926; --good: #3cc43c; --bad: #ef7777; --accent: #9db398;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 20px 56px; }

  /* ---------- 頁首 ---------- */
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .logo { width: 44px; height: 44px; border-radius: 14px; background: var(--ink); color: var(--card); display: grid; place-items: center; font-weight: 700; font-size: 20px; letter-spacing: .02em; }
  h1 { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: .02em; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .chips { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 999px; background: var(--card); box-shadow: 0 0 0 1px var(--ring); font-size: 13px; color: var(--ink-2); }
  .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--good); position: relative; }
  .pulse::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--good); opacity: .5; animation: pulse 2.2s ease-out infinite; }
  @keyframes pulse { 0% { transform: scale(.5); opacity: .6; } 100% { transform: scale(1.6); opacity: 0; } }
  button.chip { cursor: pointer; border: 0; font-family: inherit; }
  button.chip:hover { color: var(--ink); }

  /* ---------- 卡片與版面 ---------- */
  .grid { display: grid; gap: 16px; }
  .g-hero { grid-template-columns: 1.35fr 1fr 1fr 1fr; }
  .g-2 { grid-template-columns: 1fr 1fr; }
  @media (max-width: 960px) { .g-hero { grid-template-columns: 1fr 1fr; } .g-2 { grid-template-columns: 1fr; } }
  @media (max-width: 560px) { .g-hero { grid-template-columns: 1fr; } .wrap { padding: 20px 14px 40px; } }
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow), 0 0 0 1px var(--ring); padding: 20px 22px; position: relative; overflow: hidden;
          opacity: 0; transform: translateY(14px); transition: opacity .6s cubic-bezier(.2,.7,.2,1), transform .6s cubic-bezier(.2,.7,.2,1), box-shadow .25s; }
  .card.in { opacity: 1; transform: none; }
  .card:hover { box-shadow: 0 2px 4px rgba(31,29,26,.05), 0 14px 34px rgba(31,29,26,.09), 0 0 0 1px var(--ring); }
  .section { margin-top: 16px; }
  .card h2 { font-size: 15px; font-weight: 700; margin: 0 0 4px; letter-spacing: .01em; }
  .card .hint { font-size: 12.5px; color: var(--muted); margin: 0 0 14px; line-height: 1.55; }
  .label { font-size: 13px; color: var(--ink-2); }
  .value { font-size: 30px; font-weight: 700; margin-top: 6px; letter-spacing: -.01em; }
  .hero .value { font-size: 52px; line-height: 1.05; margin-top: 10px; }
  .hero::before { content: ""; position: absolute; right: -60px; top: -60px; width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle, var(--organic-wash), transparent 70%); }
  .delta { font-size: 13px; margin-top: 8px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .delta b.up { color: var(--good); } .delta b.down { color: var(--bad); } .delta b.flat { color: var(--ink); }
  .meter { height: 8px; border-radius: 99px; background: var(--grid); margin-top: 14px; overflow: hidden; display: flex; gap: 2px; }
  .meter i { display: block; height: 100%; width: 0; transition: width 1.2s cubic-bezier(.2,.7,.2,1); }
  .meter i.o { background: var(--organic); } .meter i.a { background: var(--ads); }
  .keys { display: flex; gap: 14px; font-size: 12.5px; color: var(--ink-2); margin-top: 10px; flex-wrap: wrap; }
  .key { display: inline-flex; align-items: center; gap: 6px; }
  .key::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--c); }

  /* ---------- 折線圖 ---------- */
  .chart-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .legend { display: flex; gap: 16px; font-size: 13px; color: var(--ink-2); }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .legend span::before { content: ""; width: 16px; height: 2px; border-radius: 2px; background: var(--c); }
  .line-wrap { position: relative; margin-top: 8px; }
  svg { display: block; width: 100%; overflow: visible; }
  .axis text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; font-family: var(--font); }
  .gridline { stroke: var(--grid); stroke-width: 1; }
  .baseline { stroke: var(--base); stroke-width: 1; }
  .series { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .draw { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw 1.6s cubic-bezier(.4,.1,.2,1) forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .wash { opacity: 0; animation: fade .9s .7s ease forwards; }
  @keyframes fade { to { opacity: 1; } }
  .endlabel { font-size: 12px; fill: var(--ink-2); font-family: var(--font); opacity: 0; animation: fade .5s 1.5s ease forwards; }
  .crosshair { stroke: var(--base); stroke-width: 1; opacity: 0; transition: opacity .15s; }
  .dot { stroke: var(--card); stroke-width: 2; opacity: 0; transition: opacity .15s; }
  .tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--card); border-radius: 10px; padding: 9px 12px; font-size: 12.5px; line-height: 1.6; opacity: 0;
         transform: translate(-50%, -110%); transition: opacity .15s; white-space: nowrap; box-shadow: 0 8px 20px rgba(0,0,0,.18); }
  .tip i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .note { font-size: 12.5px; color: var(--ink-2); background: var(--surface); border-radius: 12px; padding: 10px 14px; margin-top: 12px; box-shadow: 0 0 0 1px var(--ring); }

  /* ---------- 橫條 ---------- */
  .bars { display: grid; gap: 10px; }
  .bar-row { display: grid; grid-template-columns: 92px 1fr 64px; align-items: center; gap: 10px; font-size: 13px; }
  .bar-row .n { color: var(--ink-2); }
  .bar-row .v { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }
  .track { height: 14px; position: relative; }
  .fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 0 4px 4px 0; background: var(--organic); transition: width 1.1s cubic-bezier(.2,.7,.2,1); }
  .stack { height: 14px; display: flex; gap: 2px; }
  .stack i { height: 100%; width: 0; transition: width 1.1s cubic-bezier(.2,.7,.2,1); }
  .stack i:first-child { background: var(--organic); border-radius: 0; }
  .stack i:last-child { background: var(--ads); border-radius: 0 4px 4px 0; }

  /* ---------- 投流候選 ---------- */
  .cands { display: grid; gap: 10px; }
  .cand { display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 14px; background: var(--surface); box-shadow: 0 0 0 1px var(--ring);
          transition: transform .2s, box-shadow .2s; }
  .cand:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(31,29,26,.08), 0 0 0 1px var(--ring); }
  .badge { width: 56px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--organic-wash); color: var(--ink); font-weight: 700; font-size: 16px; line-height: 1; }
  .badge small { display: block; font-size: 10px; font-weight: 500; color: var(--ink-2); margin-top: 2px; }
  .cand .t { font-size: 13.5px; font-weight: 500; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .cand .m { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .empty { font-size: 13px; color: var(--muted); padding: 14px 0; }

  /* ---------- 排行表 ---------- */
  .seg { display: inline-flex; background: var(--surface); border-radius: 999px; padding: 3px; box-shadow: 0 0 0 1px var(--ring); }
  .seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; font: inherit; font-size: 13px; color: var(--ink-2); cursor: pointer; transition: background .2s, color .2s; }
  .seg button.on { background: var(--ink); color: var(--card); }
  .seg-row { display: flex; gap: 8px; flex-wrap: wrap; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 8px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  td { padding: 11px 8px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
  tr { transition: background .15s; }
  tbody tr:hover { background: var(--surface); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .ttl { display: block; font-weight: 500; min-width: 200px; max-width: 360px; line-height: 1.45; }
  a.vlink { color: inherit; text-decoration: none; background-image: linear-gradient(currentColor, currentColor); background-size: 0 1px; background-position: 0 100%; background-repeat: no-repeat; transition: background-size .25s ease, color .2s ease; }
  a.vlink:hover, a.vlink:focus-visible { color: var(--organic); background-size: 100% 1px; }
  a.vlink:focus-visible { outline: 2px solid var(--organic); outline-offset: 2px; border-radius: 4px; }
  a.vlink .ext { display: inline-block; margin-left: 4px; font-size: .85em; opacity: 0; transform: translate(-2px, 2px); transition: opacity .2s ease, transform .2s ease; }
  a.vlink:hover .ext, a.vlink:focus-visible .ext { opacity: .8; transform: none; }
  @media (prefers-reduced-motion: reduce) { a.vlink, a.vlink .ext { transition: none; } }
  .tag.topic { background: var(--organic-wash); box-shadow: none; color: var(--ink); margin-left: 4px; }
  .rating { display: inline-block; min-width: 26px; text-align: center; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; }
  .rating.r-strong { background: rgba(11,122,11,.10); color: var(--good); }
  .rating.r-mid { background: var(--surface); color: var(--ink-2); box-shadow: 0 0 0 1px var(--ring); }
  .rating.r-weak { background: rgba(194,52,52,.10); color: var(--bad); }
  .verdict { font-size: 12.5px; color: var(--ink-2); line-height: 1.5; min-width: 150px; }
  .sub2 { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .med-track { position: relative; width: 120px; height: 8px; background: var(--grid); border-radius: 99px; display: inline-block; vertical-align: middle; margin-left: 8px; }
  .med-track .fill { border-radius: 99px; }
  .med-track .one { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink-2); opacity: .5; }
  #topicMap tbody tr.trow { cursor: pointer; }
  #topicMap tbody tr.trow:focus-visible { outline: 2px solid var(--organic); outline-offset: -2px; }
  .chev { display: inline-block; margin-left: 6px; color: var(--muted); transition: transform .25s ease; font-size: 11px; }
  tr.trow.open .chev { transform: rotate(180deg); }
  .ex-count { font-size: 11.5px; color: var(--organic); margin-left: 6px; font-weight: 500; }
  tr.exrow > td { padding: 0 8px; border-bottom: 1px solid var(--grid); background: var(--surface); }
  .exwrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .35s cubic-bezier(.2,.7,.2,1); }
  tr.exrow.open .exwrap { grid-template-rows: 1fr; }
  .exwrap > div { overflow: hidden; }
  .exgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; padding: 14px 4px 16px;
            position: sticky; left: 0; max-width: calc(100vw - 72px); }
  @media (max-width: 560px) { .exgrid { grid-template-columns: 1fr; max-width: calc(100vw - 60px); } }
  .excard { background: var(--card); border-radius: 14px; overflow: hidden; box-shadow: 0 0 0 1px var(--ring); display: flex; flex-direction: column;
            opacity: 0; transform: translateY(8px); transition: opacity .4s ease, transform .4s ease, box-shadow .2s; }
  tr.exrow.open .excard { opacity: 1; transform: none; }
  .excard:hover { box-shadow: 0 8px 22px rgba(31,29,26,.10), 0 0 0 1px var(--ring); }
  .excard .thumb { position: relative; display: block; aspect-ratio: 16 / 9; background: var(--grid); }
  .excard .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .excard .mult { position: absolute; left: 8px; bottom: 8px; background: rgba(20,19,17,.82); color: #fff; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 99px; }
  .excard .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; }
  .excard .t { font-size: 13px; font-weight: 500; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .excard .m { font-size: 12px; color: var(--muted); line-height: 1.5; }
  .exempty { font-size: 12.5px; color: var(--muted); padding: 14px 4px; }
  details.rules { margin: 0 0 12px; font-size: 12.5px; color: var(--ink-2); }
  details.rules summary { cursor: pointer; color: var(--organic); }
  details.rules ol { margin: 8px 0 0; padding-left: 20px; line-height: 1.75; }
  @media (prefers-reduced-motion: reduce) { .exwrap, .excard, .chev { transition: none; } }
  .summary-chip { display: inline-flex; gap: 6px; align-items: baseline; font-size: 13px; color: var(--ink-2); }
  .summary-chip b { font-size: 22px; color: var(--ink); }
  .tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 99px; background: var(--surface); box-shadow: 0 0 0 1px var(--ring); color: var(--ink-2); margin-top: 3px; }
  .mini { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
  .mini .track { width: 90px; height: 6px; background: var(--grid); border-radius: 99px; }
  .mini .fill { border-radius: 99px; }
  .ratio { display: inline-block; min-width: 46px; text-align: center; padding: 3px 8px; border-radius: 99px; font-weight: 700; font-size: 12px; }
  .ratio.hi { background: rgba(11,122,11,.10); color: var(--good); }
  .ratio.lo { background: rgba(194,52,52,.10); color: var(--bad); }
  .ratio.mid { background: var(--surface); color: var(--ink-2); box-shadow: 0 0 0 1px var(--ring); }
  .scroll { overflow-x: auto; }

  /* ---------- 載入骨架 ---------- */
  .skel { height: 14px; border-radius: 8px; background: linear-gradient(90deg, var(--grid), var(--surface), var(--grid)); background-size: 200% 100%; animation: shimmer 1.4s infinite; margin: 10px 0; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  footer { margin-top: 26px; font-size: 12.5px; color: var(--muted); line-height: 1.8; }
  .stale { display: flex; gap: 10px; align-items: flex-start; padding: 12px 16px; margin-bottom: 16px; border-radius: 14px;
            background: rgba(194,52,52,.10); color: var(--bad); box-shadow: 0 0 0 1px rgba(194,52,52,.25); font-size: 13.5px; line-height: 1.6; }
  .stale b { font-weight: 700; }
  .err { padding: 18px; border-radius: 14px; background: rgba(194,52,52,.08); color: var(--bad); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .card { opacity: 1; transform: none; }
    .draw { stroke-dashoffset: 0; } .wash, .endlabel { opacity: 1; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">甘</div>
      <div>
        <h1>甘丹數據中心 · YouTube</h1>
        <div class="sub">自然流量優先：扣掉 YouTube 廣告來源後，影片自己帶來多少觀看</div>
      </div>
    </div>
    <div class="chips">
      <span class="chip"><span class="pulse"></span><span id="through">讀取中…</span></span>
      <button class="chip" id="themeBtn" type="button" aria-label="切換深淺色">◐ 深淺色</button>
    </div>
  </header>

  <div id="app">
    <div class="grid g-hero">
      <div class="card in"><div class="skel" style="width:40%"></div><div class="skel" style="height:44px"></div><div class="skel" style="width:60%"></div></div>
      <div class="card in"><div class="skel"></div><div class="skel" style="height:30px"></div></div>
      <div class="card in"><div class="skel"></div><div class="skel" style="height:30px"></div></div>
      <div class="card in"><div class="skel"></div><div class="skel" style="height:30px"></div></div>
    </div>
  </div>

  <footer id="foot"></footer>
</div>

<script>window.GDC_API = "https://script.google.com/macros/s/AKfycbxewWnr8kFF0ijfBLXdXip8dwNeLQHBmWHeiEYmVa2CD4sYApUsXGzFblzG-nfXGMGk/exec";</script>
<script>
(function () {
  'use strict';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var fmt = function (n) { return n == null ? '—' : Math.round(n).toLocaleString('zh-TW'); };
  var compact = function (n) { return n >= 10000 ? (n / 10000).toFixed(n >= 100000 ? 0 : 1) + ' 萬' : fmt(n); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); };
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---- 深淺色切換（記在本機） ---- */
  try { var saved = localStorage.getItem('gdc-theme'); if (saved) document.documentElement.setAttribute('data-theme', saved); } catch (e) {}
  $('#themeBtn').addEventListener('click', function () {
    var cur = document.documentElement.getAttribute('data-theme');
    var dark = cur ? cur === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    var next = dark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('gdc-theme', next); } catch (e) {}
    if (window.__DATA__) drawLine(window.__DATA__);
  });

  /* ---- 數字跳動 ---- */
  function countUp(el, to, opts) {
    opts = opts || {};
    var dur = reduce ? 0 : (opts.dur || 1200), t0 = null, from = 0;
    var show = opts.pct ? function (v) { return (v * 100).toFixed(1) + '%'; } : fmt;
    if (!dur) { el.textContent = show(to); return; }
    function step(t) {
      if (!t0) t0 = t;
      var p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      el.textContent = show(from + (to - from) * e);
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
  /* ---- 卡片依序淡入 ---- */
  function reveal() {
    var cards = document.querySelectorAll('.card:not(.in)');
    var io = 'IntersectionObserver' in window ? new IntersectionObserver(function (es) {
      es.forEach(function (en) { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } });

      return '資料還沒進來（落後約 3 天）';
    }
    if (v.ratio28 != null) return v.ratio28 >= 1.5 ? '28 天表現明顯比同類好' : v.ratio28 <= 0.5 ? '28 天表現明顯比同類差，檢討題材或內容有沒有兌現' : '28 天表現跟同類差不多';
    if (v.growth7 != null) return v.growth7 > 2.5 ? '正在擴散到新觀眾，可以考慮投流' : v.growth7 < 1.5 ? '只有訂閱者在看，沒有擴散' : '有一點擴散，再觀察到 28 天';
    if (v.ratio2 != null) return v.ratio2 < 0.5 ? '既有觀眾不買單，檢查題材與封面' : v.ratio2 >= 1 ? '開局比同期好，等第 7 天看擴散' : '開局普通，等第 7 天看擴散';
    return '資料還沒進來（落後約 3 天）';
  }
  function drawLaunch(d, k) {
    var L = d.launch || {}, list = Array.isArray(L) ? (k === 'long' ? L : []) : (L[k] || []), sh = k === 'shorts';
    $('#launchHint').textContent = sh
      ? '近 60 天上架的 Shorts，只跟其他 Shorts 比（同期中位用它之前 10 支 Shorts）。燈號門檻暫時沿用長片，選題研究沒有做 Shorts，還沒用甘丹數據驗證，先當參考。Shorts 的觀看主要來自 Shorts 動態，不是訂閱者。'
      : '近 60 天上架的長片，照拍片前審片表的拍後檢討門檻亮燈。前兩天看既有觀眾買不買單；第 2→7 天成長看有沒有擴散到新觀眾；首 28 天看最後表現。都用自然觀看，資料落後約 3 天。曝光數與縮圖點閱率還沒接，要到 YouTube 工作室看。';
    $('#launch').innerHTML = list.length ? '<table><thead><tr><th>影片</th><th class="num">前兩天自然</th><th class="num">÷同期中位</th><th class="num">第 2→7 天成長</th><th class="num">首 28 天÷同類</th><th>判讀</th></tr></thead><tbody>' +
      list.map(function (v) {
        return '<tr><td>' + vlink(v, 'ttl') + '<div class="sub2">' + esc(v.pub) + ' 上架・第 ' + v.age + ' 天' + (v.tag ? '<span class="tag topic">' + esc(v.tag) + '</span>' : '') + '</div></td>' +
          '<td class="num">' + fmt(v.first2) + '</td><td class="num">' + light(v.ratio2, 0.5, 1) + '</td><td class="num">' + light(v.growth7, 1.5, 2.5001, 1, ' 倍') + '</td>' +
          '<td class="num">' + light(v.ratio28, 0.5001, 1.5) + '</td><td class="verdict">' + esc(launchVerdict(v)) + '</td></tr>';
      }).join('') + '</tbody></table>' : '<div class="empty">近 60 天沒有上架' + (sh ? ' Shorts' : '長片') + '。</div>';
  }
  /* ---- ③ 市場題材地圖 ---- */
  var RATING_CLS = { '強': 'r-strong', '中': 'r-mid', '弱': 'r-weak' };
  function exampleCards(exs) {
    if (!exs.length) return '<div class="exempty">這一類沒有符合挑選原則的案例。</div>';
    return '<div class="exgrid">' + exs.map(function (v, j) {
      var u = vurl(v.id);
      var thumb = u ? '<a class="thumb" href="' + u + '" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true"><img alt="" loading="lazy" data-src="https://i.ytimg.com/vi/' + v.id + '/mqdefault.jpg"><span class="mult">頻道平常的 ' + (v.multiple == null ? '—' : v.multiple.toFixed(1)) + ' 倍</span></a>' : '';
      var subs = v.subs ? ' · 訂閱 ' + compact(v.subs) : '';
      return '<div class="excard" style="transition-delay:' + (j * 70) + 'ms">' + thumb + '<div class="body">' + vlink(v, 't') +
        '<div class="m">' + esc(v.channel) + subs + '<br>' + fmt(v.views) + ' 次觀看 · ' + esc(v.pub) + '</div>' +
        (v.form ? '<div><span class="tag topic" style="margin-left:0">' + esc(v.form) + '</span></div>' : '') + '</div></div>';
    }).join('') + '</div>';
  }
  function drawTopics(d, k) {
    var t = d.topics || {}, list = t[k] || [];
    $('#topicHint').textContent = (t.note || '還沒匯入選題研究資料（在 Apps Script 執行 seedTopicData）') +
      '。倍數＝影片觀看 ÷ 該頻道長片中位數，1 代表普通，灰線就是 1；爆片＝倍數 ≥2。評級照拍片前審片表附表。';
    if (!list.length) { $('#topicMap').innerHTML = '<div class="empty">還沒有資料。</div>'; return; }
    var max = Math.max.apply(null, list.map(function (x) { return Math.max(x.median || 0, x.gandanMedian || 0); }).concat([1.5]));
    var head = '<table><thead><tr><th>' + (k === 'forms' ? '形式' : '題材') + '</th>' + (k === 'topics' ? '<th>評級</th>' : '') +
      '<th class="num">市場倍數中位</th><th class="num">爆片率</th><th class="num">爆過的頻道</th><th class="num">甘丹倍數中位</th></tr></thead><tbody>';
    var rows = list.map(function (x, i) {
      var rating = k === 'topics' ? '<td>' + (x.rating ? '<span class="rating ' + (RATING_CLS[x.rating] || 'r-mid') + '">' + esc(x.rating) + '</span>' : '') + '</td>' : '';
      var med = x.median == null ? '—' : x.median.toFixed(2);
      var bar = '<span class="med-track"><span class="fill" data-w="' + ((x.median || 0) / max * 100) + '%"></span><span class="one" style="left:' + (1 / max * 100) + '%"></span></span>';
      var gd = x.gandanMedian == null ? '<span style="color:var(--muted)">沒拍過</span>' : x.gandanMedian.toFixed(2) + '<div class="sub2">' + x.gandanN + ' 支</div>';
      var exs = x.examples || [], cols = k === 'topics' ? 6 : 5;
      var cnt = exs.length ? '<span class="ex-count">' + exs.length + ' 支案例</span>' : '';
      return '<tr class="trow" tabindex="0" aria-expanded="false" data-i="' + i + '"><td><b style="font-weight:500">' + esc(x.name) + '</b>' + cnt + '<span class="chev" aria-hidden="true">▾</span><div class="sub2">市場 ' + fmt(x.n) + ' 支</div></td>' + rating +
        '<td class="num">' + med + bar + '</td><td class="num">' + (x.burstRate == null ? '—' : x.burstRate + '%') + '</td>' +
        '<td class="num">' + fmt(x.burstChannels) + '</td><td class="num">' + gd + '</td></tr>' +
        '<tr class="exrow" data-i="' + i + '"><td colspan="' + cols + '"><div class="exwrap"><div>' + exampleCards(exs) + '</div></div></td></tr>';
    }).join('');
    $('#topicMap').innerHTML = head + rows + '</tbody></table>';
    grow('#topicMap .fill');
    function toggle(tr) {
      var i = tr.getAttribute('data-i'), ex = $('#topicMap tr.exrow[data-i="' + i + '"]'), open = !tr.classList.contains('open');
      tr.classList.toggle('open', open); ex.classList.toggle('open', open); tr.setAttribute('aria-expanded', open ? 'true' : 'false');
      if (open) ex.querySelectorAll('img[data-src]').forEach(function (im) { im.src = im.getAttribute('data-src'); im.removeAttribute('data-src'); });
    }
    $('#topicMap').onclick = function (e) { if (e.target.closest('a')) return; var tr = e.target.closest('tr.trow'); if (tr) toggle(tr); };
    $('#topicMap').onkeydown = function (e) { var tr = e.target.closest('tr.trow'); if (tr && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toggle(tr); } };
  }
  /* ---- ④ 審片 vs 實際 ---- */
  function resultPill(r) {
    if (!r) return '<span class="ratio mid">未打分</span>';
    var cls = r === '對' ? 'hi' : r.indexOf('錯') === 0 ? 'lo' : 'mid';
    return '<span class="ratio ' + cls + '">' + esc(r) + '</span>';
  }
  function drawReviews(d) {
    var rv = d.reviews || { list: [], summary: { judged: 0, correct: 0 } }, list = rv.list || [];
    $('#reviewSummary').innerHTML = rv.summary && rv.summary.judged ? '已驗證 <b>' + rv.summary.judged + '</b> 支，判斷對 <b>' + rv.summary.correct + '</b> 支' : '還沒有可驗證的影片';
    if (!list.length) { $('#reviews').innerHTML = '<div class="empty">「審片紀錄」分頁還沒有資料。</div>'; return; }
    var head = '<table><thead><tr><th>影片</th><th class="num">A 流量</th><th class="num">B TA</th><th>拍前判定</th><th class="num">實際</th><th>結果</th></tr></thead><tbody>';
    var rows = list.map(function (x) {
      var ttl = x.id ? vlink({ id: x.id, title: x.title }, 'ttl') : '<span class="ttl">' + esc(x.title) + '</span>';
      var act = x.actual == null ? '—' : x.actual.toFixed(2) + '<div class="sub2">' + esc(x.actualSrc) + '</div>';
      return '<tr><td>' + ttl + '<span class="tag">' + esc(x.kind || '企劃') + '</span></td>' +
        '<td class="num">' + (x.a == null ? '—' : x.a.toFixed(1)) + '</td><td class="num">' + (x.b == null ? '—' : x.b.toFixed(1)) + '</td>' +
        '<td>' + esc(x.verdict || '—') + '</td><td class="num">' + act + '</td><td>' + resultPill(x.result) + '</td></tr>';
    }).join('');
    $('#reviews').innerHTML = head + rows + '</tbody></table>';
  }
  function drawPaid(d) {
    var p = d.paid, max = p.length ? Math.max.apply(null, p.map(function (v) { return v.ads28 + v.organic28; })) : 1;
    $('#paid').innerHTML = p.length ? p.map(function (v) {
      var tot = v.ads28 + v.organic28;
      return '<div class="bar-row" style="grid-template-columns:minmax(140px,1.2fr) 2fr 130px">' + vlink(v, 'n', ' title="' + esc(v.title) + '" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis"') +
        '<span class="stack" style="width:' + (tot / max * 100) + '%" role="img" aria-label="自然 ' + fmt(v.organic28) + '、廣告 ' + fmt(v.ads28) + '"><i data-w="' + (v.organic28 / tot * 100) + '%"></i><i data-w="' + (v.ads28 / tot * 100) + '%"></i></span>' +
        '<span class="v">廣告占 ' + (v.adsShare * 100).toFixed(0) + '%</span></div>';
    }).join('') + '<div class="keys"><span class="key" style="--c:var(--organic)">自然觀看</span><span class="key" style="--c:var(--ads)">廣告觀看</span></div>'
      : '<div class="empty">近 28 天沒有影片有廣告觀看。</div>';
    grow('#paid .stack i');
  }
  var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { if (window.__DATA__) drawLine(window.__DATA__); }, 150); });

  function fail(e) { $('#app').innerHTML = '<div class="err">讀不到資料：' + esc(e && e.message ? e.message : e) + '。請稍後重新整理；若持續發生，請告訴 Ethan。</div>'; }
  if (window.google && google.script && google.script.run) {
    google.script.run.withSuccessHandler(render).withFailureHandler(fail).getDashboardData();
  } else if (window.GDC_API) {
    // GitHub Pages 版：背景抓 Apps Script JSON（不帶 Google 登入資料，多帳號也能開）
    fetch(window.GDC_API + '?format=json', { credentials: 'omit', cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (j) { if (j && j.error) throw new Error(j.error); render(j); })
      .catch(fail);
  } else if (window.__MOCK__) {
    render(window.__MOCK__);
  } else {
    fail('不在 Apps Script 網頁中執行，也沒有預覽資料');
  }
})();
</script>
</body>
</html>
